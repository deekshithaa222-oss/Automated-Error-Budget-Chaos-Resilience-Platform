apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaosgate-controller
  namespace: chaosgate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaosgate-controller
  namespace: chaosgate
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaosgate-controller
  namespace: chaosgate
subjects:
  - kind: ServiceAccount
    name: chaosgate-controller
    namespace: chaosgate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaosgate-controller

