apiVersion: v1
kind: Secret
metadata:
  name: chaosgate-admin
  namespace: chaosgate
stringData:
  token: chaosgate-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaosgate-proxy
  namespace: chaosgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaosgate-proxy
  template:
    metadata:
      labels:
        app: chaosgate-proxy
    spec:
      containers:
        - name: proxy
          image: chaosgate:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "proxy.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: STABLE_URL
              value: http://stable:8000
            - name: CANARY_URL
              value: http://canary:8000
            - name: CANARY_PERCENT
              value: "5"
            - name: LATENCY_SLO_MS
              value: "300"
            - name: PROXY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chaosgate-admin
                  key: token
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: chaosgate
spec:
  selector:
    app: chaosgate-proxy
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaosgate-controller
  namespace: chaosgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaosgate-controller
  template:
    metadata:
      labels:
        app: chaosgate-controller
    spec:
      serviceAccountName: chaosgate-controller
      containers:
        - name: controller
          image: chaosgate:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "chaosgate.controller"]
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-server:80
            - name: PROXY_ADMIN_URL
              value: http://proxy:8000
            - name: SERVICE_NAME
              value: chaosgate-proxy
            - name: ENABLE_KUBERNETES_ROLLBACK
              value: "true"
            - name: KUBERNETES_NAMESPACE
              value: chaosgate
            - name: KUBERNETES_CANARY_DEPLOYMENT
              value: chaosgate-canary
            - name: PROXY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chaosgate-admin
                  key: token

