[project]
name = "chaosgate"
version = "0.1.0"
description = "Automated error budget and multi-window burn-rate controller with active fault injection."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "kubernetes>=30.1.0",
  "locust>=2.31.0",
  "prometheus-client>=0.20.0",
  "pydantic-settings>=2.5.2",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

