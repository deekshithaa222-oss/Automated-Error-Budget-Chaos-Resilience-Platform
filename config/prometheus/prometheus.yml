global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: chaosgate-proxy
    static_configs:
      - targets: ["proxy:8000"]

  - job_name: mock-stable
    static_configs:
      - targets: ["stable:8000"]

  - job_name: mock-canary
    static_configs:
      - targets: ["canary:8000"]

